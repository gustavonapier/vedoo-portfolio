<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página inicial da Flux.">
  <meta name="color-scheme" content="dark">
  <title>Flux</title>
  <style>
    @font-face {
      font-family: "Flux Grotesk";
      src: url("./assets/fonts/flux-grotesk.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 100 900;
    }

    :root {
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: #111;
      color: #f7f7f7;
      font-family: "Flux Grotesk", Arial, sans-serif;
    }

    /* ── Hero Section ─────────────────────────────── */
    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      padding: 28px clamp(20px, 4vw, 64px) 24px;
      overflow: hidden;
    }

    /* Background image + dark gradient overlay */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(180deg, rgba(17,17,17,.25), rgba(17,17,17,.62)),
                  url("./assets/images/heroazul.png") center / cover no-repeat;
    }

    /* Vignette overlay */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.06), #111 74%);
    }

    /* Fallback sem escurecimento ao abrir o arquivo diretamente. */
    html.is-local-file .hero::before {
      background: url("./assets/images/heroazul.png") center / cover no-repeat;
    }

    html.is-local-file .hero::after {
      display: none;
    }

    /* ── WebGL Canvas Container ───────────────────── */
    .webgl-container {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      /* O canvas só aparece após a textura carregar. */
      visibility: hidden;
    }

    .webgl-container__inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .webgl-container canvas {
      position: absolute;
      top: -10%;
      left: -10%;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────── */
    .hero__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .hero__logo {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .hero__nav {
      display: flex;
      gap: clamp(12px, 2vw, 28px);
    }

    .hero__nav a {
      color: inherit;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.03em;
      transition: opacity 0.25s ease;
    }

    .hero__nav a:hover {
      opacity: 0.65;
    }

    /* ── Hero Content ──────────────────────────────── */
    .hero__content {
      align-self: center;
      max-width: 940px;
      padding: 80px 0 48px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.76;
    }

    .hero__content h1 {
      margin: 0;
      max-width: 10ch;
      font-size: clamp(54px, 10vw, 150px);
      font-weight: 400;
      letter-spacing: -0.075em;
      line-height: 0.83;
    }

    .hero__content p:not(.eyebrow) {
      max-width: 440px;
      margin: 32px 0 0;
      font-size: clamp(17px, 2vw, 23px);
      line-height: 1.2;
    }

    /* ── Hero Footer ───────────────────────────────── */
    .hero__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 13px;
      opacity: 0.86;
      position: relative;
      z-index: 1;
    }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 620px) {
      .hero {
        padding-top: 20px;
      }

      .hero__nav {
        gap: 12px;
      }

      .hero__nav a {
        font-size: 11px;
      }

      .hero__logo {
        font-size: 20px;
      }

      .hero__content {
        align-self: end;
        transform: none;
      }
    }
  </style>
</head>
<body>

  <section class="hero" id="inicio">

    <!-- WebGL Canvas Layer -->
    <div class="webgl-container" aria-hidden="true">
      <div class="webgl-container__inner">
        <canvas></canvas>
      </div>
    </div>

    <!-- Header -->
    <header class="hero__header">
      <span class="hero__logo">FLUX</span>
      <nav class="hero__nav">
        <a href="#inicio">Início</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>
      </nav>
    </header>

    <!-- Content -->
    <section class="hero__content" id="servicos" aria-labelledby="titulo-principal">
      <p class="eyebrow">Estratégia · Vídeo · Branding</p>
      <h1 id="titulo-principal">Ideias que ganham movimento.</h1>
      <p>Escolha um plano, envie sua solicitação e dê início ao próximo projeto.</p>
    </section>

    <!-- Footer -->
    <footer class="hero__footer" id="contato">
      <span>© 2025 Flux</span>
    </footer>

  </section>

<script src="./assets/js/main.js"></script>

</body>
</html>
