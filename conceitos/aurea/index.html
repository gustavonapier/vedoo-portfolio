<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aurea Residences — casas contemporâneas em harmonia com a natureza." />
  <title>Aurea Residences | Viver é escolher o extraordinário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <main class="hero" id="inicio">
    <div class="hero__backdrop"></div>

    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Aurea Residences - início">
        <span class="brand__mark" aria-hidden="true">A</span>
        <span class="brand__name">Aurea<small>Residences</small></span>
      </a>
      <nav class="navigation" aria-label="Navegação principal">
        <a href="#projeto">O projeto</a>
        <a href="#contato">Contato</a>
        <button class="menu-button" type="button" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span>
        </button>
      </nav>
    </header>

    <section class="hero__content" aria-labelledby="hero-title">
      <h1 id="hero-title">Seu espaço para<br /><em>viver o essencial.</em></h1>
      <p class="hero__subheadline">Residências contemporâneas desenhadas para aproximar você da natureza, do conforto e de tudo o que realmente importa.</p>
    </section>

    <div class="hero__footer">
      <div class="background-toggle" role="group" aria-label="Alternar imagem de fundo">
        <button class="background-toggle__button is-active" type="button" data-background="hero1" aria-pressed="true">ON</button>
        <button class="background-toggle__button" type="button" data-background="hero2" aria-pressed="false">OFF</button>
      </div>
    </div>
  </main>
  <script src="assets/js/script.js"></script>
</body>
</html>
