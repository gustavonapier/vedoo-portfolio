<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dissolver Blue — um novo estado para criar com clareza, presença e liberdade."
    />
    <title>Dissolver Blue</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__background hero__background--base" aria-hidden="true"></div>
        <div class="hero__background hero__background--reveal" aria-hidden="true"></div>
        <div class="hero__blue-reveal" aria-hidden="true"></div>

        <div class="hero__copy">
          <h1 id="hero-title">
            <span>Posicione sua marca</span>
            <span>para ser lembrada e escolhida.</span>
          </h1>
        </div>

        <img
          class="hero__person"
          src="assets/images/homemsemfundo.png"
          alt=""
          aria-hidden="true"
        />

        <div class="hero__copy hero__copy--reveal" aria-hidden="true">
          <h1>
            <span>Posicione sua marca</span>
            <span>para ser lembrada e escolhida.</span>
          </h1>
        </div>

        <div class="hero__footer">
          <p>
            Um novo estado para criar com
            <strong>clareza, presença e liberdade.</strong>
          </p>

          <a class="hero__cta" href="#descobrir">
            <span>Descobrir a experiência</span>
            <span class="hero__cta-icon" aria-hidden="true">↘</span>
          </a>
        </div>

      </section>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
