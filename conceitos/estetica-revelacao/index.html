<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ded2c3" />
    <meta name="description" content="Clínica de Estética Avançada — Realce sua beleza natural com sofisticação, alta tecnologia e protocolos personalizados." />
    <title>Clínica de Estética Avançada | Harmonização &amp; Beleza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title" tabindex="0">
        <div class="hero__background" aria-hidden="true"></div>
        <div class="hero__shade" aria-hidden="true"></div>

        <div class="hero__content">
          <p class="hero__eyebrow">Estética Avançada • Harmonização Facial • Alta Tecnologia</p>
          <p class="hero__signature" aria-hidden="true">ESTÉTICA</p>
          <h1 class="hero__title" id="hero-title">
            A arte de realçar<br />
            <span>sua beleza natural.</span>
          </h1>
          <div class="hero__credit">
            <span class="hero__credit-left">Dra. Marcella Guimarães</span>
            <span class="hero__credit-right">Estética Avançada</span>
          </div>
        </div>

        <img
          class="hero__portrait"
          src="assets/imagens/capa1.png"
          alt="Especialista em estética avançada segurando instrumento de precisão"
          fetchpriority="high"
        />
      </section>
    </main>
  </body>
</html>
